<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grant Customer Access — Party Biz Hub</title>
<style>
  body { font-family: Inter, sans-serif; background: #f5f0ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { background: #fff; border-radius: 20px; padding: 40px 36px; max-width: 480px; width: 100%; box-shadow: 0 8px 32px rgba(76,29,149,.12); }
  h1 { font-size: 1.4rem; font-weight: 800; color: #4C1D95; margin-bottom: 6px; }
  p.sub { font-size: .88rem; color: #888; margin-bottom: 28px; line-height: 1.6; }
  label { display: block; font-size: .75rem; font-weight: 700; color: #6C6473; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  input, select { width: 100%; padding: 13px 14px; border: 1.5px solid #DDD1E5; border-radius: 10px; font-size: .95rem; font-family: inherit; outline: none; margin-bottom: 16px; box-sizing: border-box; background: #fff; }
  input:focus, select:focus { border-color: #7C3AED; }
  button { width: 100%; padding: 15px; background: linear-gradient(135deg, #D115AE, #7559D4); color: #fff; font-weight: 800; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .result { margin-top: 20px; padding: 16px; border-radius: 10px; font-size: .88rem; line-height: 1.6; display: none; }
  .result.success { background: #f0fdf4; border: 1.5px solid #86efac; color: #166534; }
  .result.error   { background: #fff1f2; border: 1.5px solid #fca5a5; color: #991b1b; }
</style>
</head>
<body>
<div class="card">
  <h1>🎉 Grant Customer Access</h1>
  <p class="sub">Enter the customer's details below. This will create their account, give them the access you choose, and email them their login link automatically.</p>

  <label>Customer Email *</label>
  <input type="email" id="email" placeholder="customer@email.com"/>

  <label>Customer Name (optional)</label>
  <input type="text" id="name" placeholder="Jane Smith"/>

  <label>What did they buy? *</label>
  <select id="accessType">
    <option value="kpps">Kids Party Profit System (full access)</option>
    <option value="crm">CRM + Website Builder only ($27/mo subscriber)</option>
    <option value="ppp">Party Profit Printables only</option>
    <option value="both">Both (KPPS + Printables)</option>
  </select>

  <button id="btn" onclick="grantAccess()">Send Access Email →</button>

  <div class="result" id="result"></div>
</div>

<script>
// Simple admin gate — keeps this page private
(function() {
  const PASS = 'pbhsupport2026';
  const key  = 'pbh_support_auth';
  if (sessionStorage.getItem(key) !== PASS) {
    const entered = prompt('Enter support password:');
    if (entered !== PASS) {
      document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;padding:60px;color:#888">Access denied.</p>';
      return;
    }
    sessionStorage.setItem(key, PASS);
  }
})();

async function grantAccess() {
  const email = document.getElementById('email').value.trim();
  const name  = document.getElementById('name').value.trim();
  const accessType = document.getElementById('accessType').value;
  const btn   = document.getElementById('btn');
  const result = document.getElementById('result');

  if (!email) { alert('Please enter the customer email.'); return; }

  btn.disabled = true;
  btn.textContent = 'Sending…';
  result.style.display = 'none';

  try {
    const resp = await fetch('/api/send-purchase-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'grant-access', email, accessType, customerName: name }),
    });
    const data = await resp.json();

    if (data.success) {
      const flagHint = accessType === 'kpps' ? 'has_kpps_access = true and has_crm_access = true'
        : accessType === 'both' ? 'has_kpps_access = true, has_crm_access = true and has_printables_access = true'
        : accessType === 'crm' ? 'has_crm_access = true'
        : 'has_printables_access = true';
      const profileWarn = data.profileWritten === false
        ? `<br/><br/>⚠️ <strong>Access flag could not be saved</strong> (${data.profileError || 'unknown error'}). The customer will still see a "purchase" prompt. Fix: go to your Supabase dashboard → Table Editor → profiles → find the row for <strong>${email}</strong> and manually set <code>${flagHint}</code>.`
        : '';
      const emailWarn = data.emailSent ? '' : `<br/><br/>⚠️ Email could not be sent automatically${data.emailError ? ` (reason: <strong>${data.emailError}</strong>)` : ''} — send the login link manually: <a href="${data.loginUrl}" target="_blank">Click here for their login link</a>`;
      result.className = 'result success';
      result.innerHTML = `✅ <strong>Done!</strong> Account set up for <strong>${email}</strong>.${profileWarn}${emailWarn}`;
    } else {
      result.className = 'result error';
      result.innerHTML = `❌ Something went wrong: ${data.error || JSON.stringify(data)}`;
    }
  } catch (err) {
    result.className = 'result error';
    result.innerHTML = `❌ Network error: ${err.message}`;
  }

  result.style.display = 'block';
  btn.disabled = false;
  btn.textContent = 'Send Access Email →';
}
</script>
</body>
</html>
