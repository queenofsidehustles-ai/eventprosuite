<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Loading…</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="classic-config.js?v=1"></script>
<script src="quick-answers.js?v=1"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#fff}
img{max-width:100%;display:block}
a{text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none}

/* Loading gate */
#loading-gate{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999;transition:opacity .35s ease}
#loading-gate.fade-out{opacity:0;pointer-events:none}
.spinner{width:52px;height:52px;border:4px solid rgba(106,63,138,.15);border-top-color:#6D28D9;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;font-weight:600;color:#888;letter-spacing:.04em}

/* Error state */
#error-state{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:40px 24px;background:linear-gradient(135deg,#FDF6FF 0%,#F5F0FB 100%)}
#error-state.visible{display:flex}
.error-emoji{font-size:64px;line-height:1}
.error-title{font-size:24px;font-weight:800;color:#1A1625}
.error-sub{font-size:15px;color:#6C6473;max-width:320px}

/* Site root — filled by JS */
#site-root{display:none}
#site-root.visible{display:block}
</style>
</head>
<body>

<div id="loading-gate">
  <div class="spinner"></div>
  <div class="loading-text">Loading your party page…</div>
</div>

<div id="error-state">
  <div class="error-emoji">🎈</div>
  <div class="error-title">Page Not Found</div>
  <div class="error-sub">We couldn't find this party business page. Double-check the link and try again!</div>
</div>

<div id="site-root"></div>

<script>
(function () {
  const SUPA_URL  = 'https://dmqwoddwzpfnmpjtwiee.supabase.co';
  const SUPA_ANON = 'sb_publishable_DFQoTRoat37YdIzPHzbZsQ_rAcubQH8';

  /* ── Helpers ── */
  function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
  function darkenHex(hex,amt){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);const r=Math.max(0,(n>>16)-amt);const g=Math.max(0,((n>>8)&0xff)-amt);const b=Math.max(0,(n&0xff)-amt);return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
  function hexToRgba(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);return'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'}
  function lightenHex(hex,amt){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16);const r=Math.min(255,(n>>16)+amt);const g=Math.min(255,((n>>8)&0xff)+amt);const b=Math.min(255,(n&0xff)+amt);return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
  function first(...vals){for(const v of vals){if(v!=null&&v!=='')return v}return null}
  function packageBookURL(base,pkg){
    if(!base||base.charAt(0)==='#'||!pkg||!pkg.name)return base;
    return base+(base.includes('?')?'&':'?')+'service='+encodeURIComponent(String(pkg.name));
  }

  /* ── Builder → site normalizers ──
     The builder writes gallery photos as plain data-URL strings, FAQ items as
     {question,answer}, and package contents as a newline-separated `included`
     string. Older/alternate shapes are tolerated so previously saved builds
     keep rendering. ── */
  function normGallery(gallery_data){
    const raw=(gallery_data&&Array.isArray(gallery_data.photos))?gallery_data.photos:[];
    return raw.map(p=>{
      if(!p)return null;
      if(typeof p==='string')return p;
      return p.dataURL||p.url||p.src||null;
    }).filter(Boolean);
  }
  function normFaqs(faq_data){
    const raw=(faq_data&&Array.isArray(faq_data.items))?faq_data.items:[];
    return raw.map(i=>({
      q:String((i&&(i.question!=null?i.question:i.q))||'').trim(),
      a:String((i&&(i.answer!=null?i.answer:i.a))||'').trim()
    })).filter(i=>i.q||i.a);
  }
  function normAddons(addons_data){
    const raw=Array.isArray(addons_data)?addons_data:[];
    return raw.map(a=>{
      const name=String((a&&a.name)||'').trim();
      if(!name)return null;
      const rawPrice=(a&&a.price!=null)?String(a.price).trim():'';
      const price=rawPrice===''?'':(/^[0-9]+(\.[0-9]+)?$/.test(rawPrice)?'$'+rawPrice:rawPrice);
      return{name:name,price:price};
    }).filter(Boolean);
  }
  function pkgIncludes(pkg){
    if(!pkg)return[];
    const src=pkg.included!=null?pkg.included:pkg.includes;
    if(Array.isArray(src))return src.map(l=>String(l).trim()).filter(Boolean);
    return String(src||'').split('\n').map(l=>l.trim()).filter(Boolean);
  }
  /* Renders every line the owner typed — no truncation. */
  function includesList(pkg,cls){
    const lines=pkgIncludes(pkg);
    if(!lines.length)return'';
    return'<ul class="'+cls+'">'+lines.map(l=>'<li>'+esc(l)+'</li>').join('')+'</ul>';
  }

  function showError(){
    document.getElementById('loading-gate').classList.add('fade-out');
    setTimeout(()=>{document.getElementById('loading-gate').style.display='none';document.getElementById('error-state').classList.add('visible')},350);
  }
  function showContent(){
    const gate=document.getElementById('loading-gate');
    gate.classList.add('fade-out');
    setTimeout(()=>{gate.style.display='none';const r=document.getElementById('site-root');r.style.display='block'},350);
  }

  const params=new URLSearchParams(window.location.search);
  const uid=params.get('uid');
  // Inline data sources: (1) window.__INLINE_DATA__ injected at download time, (2) localStorage bridge from template picker Preview button
  let _inline=window.__INLINE_DATA__||null;
  if(!_inline){try{const _ls=localStorage.getItem('pbh_preview_data');if(_ls){localStorage.removeItem('pbh_preview_data');_inline=JSON.parse(_ls);}}catch(_e){}}
  if(!uid&&!_inline){showError();return}

  const bookURL=uid?'book.html?uid='+encodeURIComponent(uid):'#book';
  const supabase=window.supabase.createClient(SUPA_URL,SUPA_ANON);

  // Public pages read a business's branding without anyone logged in. The
  // profiles table itself is private, so that goes through a curated
  // security-definer function which returns only the public-facing fields —
  // never the API keys, entitlements or internal pricing that also live there.
  // The direct read is kept as a fallback purely so this page keeps working in
  // the window between deploying and running the migration.
  async function loadPublicProfile(client, id){
    try{
      const { data, error } = await client.rpc('get_public_profile', { p_id: id });
      if(!error && Array.isArray(data) && data.length) return data[0];
      if(!error && data && !Array.isArray(data)) return data;
    }catch(e){ /* function not deployed yet — fall through */ }
    const { data: row } = await client.from('profiles').select('profile_data,full_name').eq('id', id).maybeSingle();
    return row;
  }


  (_inline
    ?Promise.resolve([{data:_inline.profile,error:null},{data:_inline.build,error:null}])
    :Promise.all([
        loadPublicProfile(supabase, uid).then(row=>({data:row,error:row?null:{message:'not found'}})),
        supabase.from('website_builds').select('*').eq('user_id',uid).order('updated_at',{ascending:false}).limit(1).maybeSingle()
      ])
  ).then(([pRes,bRes])=>{
    if(pRes.error||!pRes.data){showError();return}
    const pd   = pRes.data.profile_data||{};
    const full = pRes.data.full_name||'';
    const rawBuild=bRes.data||null;
    // Preview data always uses the current draft. Public sites use the last
    // published snapshot so autosave can never change a live site early.
    const snapshot=rawBuild&&rawBuild.booking_data&&rawBuild.booking_data._publishedSnapshot;
    // Never show an unpublished draft to the public.
    if(!_inline&&rawBuild&&!snapshot&&!rawBuild.last_published_at){
      const es=document.getElementById('error-state');
      if(es)es.innerHTML='<div style="font-size:44px">🎈</div><h2 style="font-family:Georgia,serif;color:#2A1340">This website is almost ready</h2><p style="color:#6B5F7A;max-width:420px">The owner is putting the finishing touches on it. Please check back soon.</p>';
      showError();return;
    }
    const wb=(!_inline&&snapshot&&typeof snapshot==='object')?snapshot:rawBuild;
    const brand_data   =(wb&&wb.brand_data)||{};
    const niche_data   =(wb&&wb.niche_data)||{};
    const about_data   =(wb&&wb.about_data)||{};
    const gallery_data =(wb&&wb.gallery_data)||{};
    const packages_data=(wb&&Array.isArray(wb.packages_data)&&wb.packages_data.length>0)?wb.packages_data:null;
    const reviews_data =(wb&&Array.isArray(wb.reviews_data)&&wb.reviews_data.length>0)?wb.reviews_data:null;
    const faq_data     =(wb&&wb.faq_data&&Array.isArray(wb.faq_data.items)&&wb.faq_data.items.length>0)?wb.faq_data:null;
    const addons_data  =(wb&&Array.isArray(wb.addons_data))?wb.addons_data:[];

    // Normalized, render-ready collections
    const faqItems     = normFaqs(faq_data);
    const photos       = normGallery(gallery_data);
    const addons       = normAddons(addons_data);

    const rawBrand  = first(brand_data.customPrimary,pd.brandColor,'#6D28D9');
    const brand     = /^#[0-9A-Fa-f]{3,6}$/.test(rawBrand)?rawBrand:'#6D28D9';
    const brandDark = darkenHex(brand,40);
    const brandLight= hexToRgba(brand,0.12);

    const bizName   = first(brand_data.businessName,pd.businessName,full)||'Party Business';
    const tagline   = first(niche_data.tagline,brand_data.tagline,pd.tagline,'Creating unforgettable parties for your little ones.');
    const logo      = first(brand_data.logoDataURL,pd.logoDataURL,pd.logo);
    const ownerName = first(about_data.ownerName,pd.ownerName,full)||bizName;
    const ownerBio  = first(about_data.bio,pd.ownerBio,bizName+' is dedicated to creating unforgettable kids parties.');
    const ownerPhoto= first(about_data.photoDataURL);
    const heroPhoto = first(gallery_data.heroPhotoDataURL);
    const socialInstagram=first(brand_data.socialInstagram,pd.instagram);
    const socialFacebook =first(brand_data.socialFacebook, pd.facebook);
    const socialTiktok   =first(brand_data.socialTiktok,   pd.tiktok);
    const socialYoutube  =first(brand_data.socialYoutube);
    const socialCustom   =first(brand_data.socialCustom);
    const phone          =first(pd.contactPhone,brand_data.phone);
    const email          =first(pd.contactEmail,brand_data.email);
    const nicheLabel     =first(niche_data.name,wb&&wb.niche_type);

    const city=first(pd.city,brand_data.city);

    /* ── SEO meta injection (helps with social sharing + search) ── */
    // ── SEO: title, meta, OG, structured data ──
    const cityLabel = city||'';
    document.title = bizName + (cityLabel?' · '+cityLabel:'') + ' | Kids Party Entertainment';
    const metaDesc = (tagline||bizName+' — magical kids party entertainment')
      + (cityLabel?' Serving '+cityLabel+' and surrounding areas.':'');
    // Standard meta
    [['description',metaDesc],['robots','index, follow'],['keywords',
      [bizName, nicheLabel, 'kids party', cityLabel, 'birthday party entertainment',
       'party host', cityLabel&&cityLabel+' kids party', cityLabel&&cityLabel+' party entertainment']
      .filter(Boolean).join(', ')
    ]].forEach(([n,v])=>{const m=document.createElement('meta');m.name=n;m.content=v;document.head.appendChild(m)});
    // Open Graph + Twitter
    [['og:title',bizName+' — Kids Party Entertainment'+(cityLabel?' in '+cityLabel:'')],['og:description',metaDesc],['og:type','website'],['og:url',window.location.href],['twitter:card','summary_large_image'],['twitter:title',bizName],['twitter:description',metaDesc]].forEach(([n,v])=>{const m=document.createElement('meta');m.setAttribute('property',n);m.content=v;document.head.appendChild(m)});
    if(heroPhoto||logo){const m=document.createElement('meta');m.setAttribute('property','og:image');m.content=heroPhoto||logo;document.head.appendChild(m)}
    // Canonical URL
    const cEl=document.createElement('link');cEl.rel='canonical';cEl.href=window.location.href.split('?')[0]+(uid?'?uid='+uid:'');document.head.appendChild(cEl);
    // JSON-LD — LocalBusiness + service offers
    const pkgOffers=(packages_data||[]).map(p=>({'@type':'Offer','name':p.name||'Package','price':String(p.price||'').replace(/[^0-9.]/g,''),'priceCurrency':'USD','description':p.included||undefined}));
    const ldData={'@context':'https://schema.org','@type':'LocalBusiness','name':bizName,'description':metaDesc,'telephone':phone||undefined,'email':email||undefined,'image':heroPhoto||logo||undefined,'url':window.location.href,'address':cityLabel?{'@type':'PostalAddress','addressLocality':cityLabel,'addressCountry':'US'}:undefined,'areaServed':cityLabel?[{'@type':'City','name':cityLabel}]:undefined,'priceRange':pkgOffers.length?'$'+Math.min(...pkgOffers.map(o=>parseFloat(o.price)||999))+'–$'+Math.max(...pkgOffers.map(o=>parseFloat(o.price)||0)):'$$','hasOfferCatalog':pkgOffers.length?{'@type':'OfferCatalog','name':bizName+' Party Packages','itemListElement':pkgOffers}:undefined};
    const ldEl=document.createElement('script');ldEl.type='application/ld+json';ldEl.textContent=JSON.stringify(ldData);document.head.appendChild(ldEl);

    const template=first(brand_data.template,'studio');
    // Classic is a full page of its own (template.html), filled from the same saved data.
    if(template==='classic'&&window.PBHClassic){
      fetch('template.html').then(r=>{if(!r.ok)throw new Error('template');return r.text()}).then(tpl=>{
        const html=PBHClassic.merge(tpl,PBHClassic.configFromData(pd,wb||{},{ownerId:uid||''}));
        document.open();document.write(html);document.close();
      }).catch(()=>showError());
      return;
    }
    const data={bizName,tagline,logo,ownerName,ownerBio,ownerPhoto,heroPhoto,brand,brandDark,brandLight,bookURL,nicheLabel,packages_data,reviews_data,faq_data,gallery_data,about_data,phone,email,socialInstagram,socialFacebook,socialTiktok,socialYoutube,socialCustom,city,faqItems,photos,addons};

    const root=document.getElementById('site-root');
    if(template==='luxe')buildLuxe(root,data);
    else if(template==='pop')buildPop(root,data);
    else if(template==='garden')buildGarden(root,data);
    else if(template==='bloom')buildBloom(root,data);
    else buildStudio(root,data);

    // Inject shared contact form before the footer of every template
    const footer=root.querySelector('footer');
    const contactWrap=document.createElement('div');
    contactWrap.innerHTML=buildContactSection(data,uid);
    if(footer)footer.parentNode.insertBefore(contactWrap,footer);
    else root.appendChild(contactWrap);
    // Scripts added through innerHTML never run, so re-create them (makes the message form work).
    contactWrap.querySelectorAll('script').forEach(old=>{const sc=document.createElement('script');sc.textContent=old.textContent;old.replaceWith(sc)});

    showContent();
    if(window.PBHQuickAnswers)PBHQuickAnswers.init({businessName:bizName,ownerName,brand,phone,email,city,packages:packages_data||[],addons,faqs:faqItems,bookUrl:bookURL});
  }).catch(()=>showError());

  /* ══════════════════════════════════════════════════════════════
     Shared helpers for the Luxe / Garden / Bloom templates (tpl3_*)
     Colour maths keeps every owner's brand colour readable, the motif
     gives photo-less sites a tasteful picture, and tpl3_prep only ever
     returns the owner's real data (no invented stats or reviews).
  ══════════════════════════════════════════════════════════════ */
  function tpl3_rgb(hex){hex=String(hex||'').replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');const n=parseInt(hex,16)||0;return[(n>>16)&255,(n>>8)&255,n&255]}
  function tpl3_hex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')}
  function tpl3_mix(a,b,t){const A=tpl3_rgb(a),B=tpl3_rgb(b);return tpl3_hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
  function tpl3_rgba(hex,a){const c=tpl3_rgb(hex);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
  function tpl3_lum(hex){const c=tpl3_rgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
  function tpl3_contrast(a,b){const x=tpl3_lum(a),y=tpl3_lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  /* Darken (towards `toward`) until the colour reaches `min` contrast against `bg`. */
  function tpl3_deepen(hex,bg,min,toward){let c=hex;for(let i=0;i<30&&tpl3_contrast(c,bg)<min;i++)c=tpl3_mix(c,toward||'#000000',.08);return c}
  function tpl3_motifKind(label){
    const s=String(label||'').toLowerCase();
    if(/teepee|tipi|tepee|tent|glamp|camp/.test(s))return'teepee';
    if(/bear|plush|stuff|teddy/.test(s))return'bear';
    if(/movie|cinema|film|screen/.test(s))return'movie';
    if(/spa|pamper|glam|mani|beauty|makeover|tea party/.test(s))return'spa';
    if(/craft|paint|art|diy|slime|canvas|make/.test(s))return'craft';
    if(/sleep|slumber|pajama|night|dream/.test(s))return'moon';
    return'balloon';
  }
  function tpl3_motif(label,cls){
    const P={
      teepee:'<path d="M12 4 4.5 20.5h15L12 4Z"/><path d="M12 4 9.6 1.5M12 4l2.4-2.5"/><path d="M9.8 20.5 12 14.5l2.2 6"/><path d="M8.2 12.6h7.6"/>',
      bear:'<circle cx="12" cy="13.2" r="6.6"/><circle cx="6.6" cy="7.2" r="2.4"/><circle cx="17.4" cy="7.2" r="2.4"/><ellipse cx="12" cy="15.9" rx="2.3" ry="1.7"/><path d="M11.2 15.1h1.6l-.8.8z" fill="currentColor"/><path d="M12 15.9v.6"/><circle cx="9.5" cy="12" r=".45" fill="currentColor" stroke="none"/><circle cx="14.5" cy="12" r=".45" fill="currentColor" stroke="none"/>',
      spa:'<path d="M12 19.5c-1.9-2.6-2.2-8.1 0-12 2.2 3.9 1.9 9.4 0 12Z"/><path d="M12 19.5c-3-.4-7-2.6-7.6-7.6 3 .3 5.6 2.2 7.6 5"/><path d="M12 19.5c3-.4 7-2.6 7.6-7.6-3 .3-5.6 2.2-7.6 5"/><path d="M5 21.5h14"/>',
      movie:'<rect x="3.5" y="9.5" width="17" height="11" rx="1.2"/><path d="m3.5 9.5 1.2-4.6 15.3-1.6.5 4.4-17 1.8"/><path d="m8.4 4.6 1.6 4.4M13.6 4l1.6 4.5"/><path d="M10.5 13.2v4l3.3-2-3.3-2Z"/>',
      craft:'<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.3 0 1.9-.8 1.9-1.8 0-1.2-.9-1.5-.9-2.4 0-.9.7-1.5 1.7-1.5h2.2c2 0 3.6-1.5 3.6-3.6 0-4.3-3.8-7.7-8.5-7.7Z"/><circle cx="7.6" cy="11.3" r="1"/><circle cx="10.4" cy="7.6" r="1"/><circle cx="15" cy="7.8" r="1"/>',
      moon:'<path d="M19.5 14.6A7.8 7.8 0 1 1 9.4 4.5a6.2 6.2 0 0 0 10.1 10.1Z"/><path d="M16.5 3.5v3M15 5h3M20 8.5v2M19 9.5h2"/>',
      balloon:'<path d="M12 3c3.4 0 6 2.6 6 6.1 0 3.9-3 7.2-6 8-3-.8-6-4.1-6-8C6 5.6 8.6 3 12 3Z"/><path d="m11 17.1 1-.1 1 .1-1 1.4-1-1.4Z"/><path d="M12 18.5c0 1.6-1.6 1.6-1.6 3.2"/><path d="M9 7.5c.5-1 1.3-1.6 2.3-1.9"/>'
    };
    return'<svg class="'+(cls||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+P[tpl3_motifKind(label)]+'</svg>';
  }
  function tpl3_money(v){
    if(v==null)return'';
    const s=String(v).trim();
    if(s==='')return'';
    if(/^\d+(\.\d+)?$/.test(s)){const n=Number(s);return'$'+(n%1?n.toFixed(2):n.toLocaleString('en-US'))}
    return s;
  }
  /* Everything the three templates render comes from here: real data only. */
  function tpl3_prep(d){
    const pkgs=(d.packages_data||[]).filter(p=>p&&(String(p.name||'').trim()||pkgIncludes(p).length||tpl3_money(p.price)));
    const reviews=(d.reviews_data||[]).filter(r=>r&&String(r.text||'').trim()).map(r=>({
      text:String(r.text).trim(),
      name:String(r.name||r.author||'').trim(),
      event:String(r.event||'').trim(),
      rating:Math.min(5,Math.max(0,parseInt(r.rating)||0))
    }));
    const defaultBio=d.bizName+' is dedicated to creating unforgettable kids parties.';
    const bio=(d.ownerBio&&d.ownerBio!==defaultBio)?String(d.ownerBio).trim():'';
    const ownerName=(d.ownerName&&d.ownerName!==d.bizName)?d.ownerName:'';
    const since=d.about_data&&/^\d{4}$/.test(String(d.about_data.yearStarted||'').trim())?String(d.about_data.yearStarted).trim():'';
    const nums=pkgs.map(p=>String(p.price==null?'':p.price).trim()).filter(s=>/^\d+(\.\d+)?$/.test(s)).map(Number).filter(n=>n>0);
    const kids=pkgs.map(p=>parseInt(p.kids)).filter(n=>n>0);
    const facts=[];
    if(nums.length)facts.push({k:'price',label:(nums.length>1?'Packages from ':'Package price ')+tpl3_money(Math.min(...nums))});
    if(kids.length)facts.push({k:'kids',label:'Up to '+Math.max(...kids)+' kids'});
    if(d.city)facts.push({k:'city',label:'Serving '+d.city});

/* HERO */
.pp-hero{padding:56px 24px 72px;text-align:center;position:relative;overflow:hidden;background:var(--white)}
.pp-blob1{position:absolute;width:500px;height:500px;border-radius:70% 30% 60% 40% / 50% 60% 40% 50%;background:var(--brand-lt);top:-180px;left:-150px;z-index:0;opacity:.7}
.pp-blob2{position:absolute;width:380px;height:380px;border-radius:40% 60% 30% 70% / 60% 40% 70% 30%;background:rgba(245,166,35,.12);bottom:-120px;right:-100px;z-index:0}
.pp-hero-photo-wrap{position:relative;z-index:1;max-width:680px;margin:0 auto 32px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg)}
.pp-hero-photo-wrap img{width:100%;height:auto;aspect-ratio:16/9;max-height:440px;object-fit:cover;object-position:center;display:block}
@media(max-width:640px){.pp-hero-photo-wrap img{aspect-ratio:4/3}}
.pp-hero-in{position:relative;z-index:1;max-width:720px;margin:0 auto}
.pp-niche-tag{display:inline-block;background:var(--brand);color:#fff;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:6px 18px;border-radius:999px;margin-bottom:20px}
.pp-h1{font-family:'Dancing Script',cursive;font-size:clamp(52px,9vw,88px);font-weight:700;color:var(--text);line-height:1.05;margin-bottom:16px}
.pp-h1 .pp-biz-color{color:var(--brand)}
.pp-tagline{font-size:clamp(16px,2.5vw,19px);color:var(--muted);margin-bottom:36px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.65}
.pp-hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pp-btn-main{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:15px 36px;border-radius:999px;font-size:16px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:background .18s,transform .18s}
.pp-btn-main:hover{background:var(--brand-dk);transform:translateY(-2px)}
.pp-btn-outline{display:inline-flex;align-items:center;padding:15px 26px;border-radius:999px;font-size:15px;font-weight:700;border:2px solid var(--line);color:var(--muted);transition:border-color .18s}
.pp-btn-outline:hover{border-color:var(--brand);color:var(--brand)}

/* SECTION HEADERS */
.pp-section-head{text-align:center;margin-bottom:44px}
.pp-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);background:var(--brand-lt);padding:5px 14px;border-radius:999px;margin-bottom:10px}
.pp-section-title{font-family:'Dancing Script',cursive;font-size:clamp(32px,5vw,50px);font-weight:700;color:var(--text);margin-bottom:8px}
.pp-section-sub{font-size:15px;color:var(--muted);max-width:420px;margin:0 auto}

/* SERVICE CARDS */
.pp-section{padding:72px 24px}
.pp-section-cream{background:var(--cream)}
.pp-max{max-width:1140px;margin:0 auto}
.pp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.pp-card{background:var(--white);border-radius:var(--radius);border:2px solid var(--line);overflow:hidden;box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s,border-color .22s;display:flex;flex-direction:column}
.pp-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);border-color:var(--brand)}
.pp-card-top{padding:28px 24px 16px;flex:1}
.pp-card-emoji{font-size:36px;margin-bottom:14px}
.pp-card-name{font-size:19px;font-weight:800;color:var(--text);margin-bottom:6px}
.pp-card-price{font-size:28px;font-weight:800;color:var(--brand);margin:8px 0 2px}
.pp-card-duration{display:inline-block;font-size:12px;font-weight:700;color:var(--muted);background:var(--cream);padding:3px 10px;border-radius:999px}
.pp-card-desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin-top:10px}
.pp-card-includes{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.pp-card-includes li{font-size:13.5px;color:var(--muted);line-height:1.5;padding-left:21px;position:relative}
.pp-card-includes li::before{content:'✓';position:absolute;left:0;top:0;color:var(--brand);font-weight:900}

/* ADD-ONS */
.pp-addons-hd{margin:48px 0 18px;text-align:center;font-size:22px;font-weight:900;color:var(--text);letter-spacing:-.01em}
.pp-addons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pp-addon{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;background:var(--white);border:2px solid var(--line);border-radius:var(--radius);transition:border-color .18s,transform .18s}
.pp-addon:hover{border-color:var(--brand);transform:translateY(-2px)}
.pp-addon-name{font-size:14px;font-weight:700;color:var(--text)}
.pp-addon-price{font-size:17px;font-weight:900;color:var(--brand);white-space:nowrap}
.pp-card-cta{display:block;margin:0 24px 24px;background:var(--brand);color:#fff;padding:13px;border-radius:14px;font-size:14px;font-weight:800;text-align:center;transition:background .18s}
.pp-card-cta:hover{background:var(--brand-dk)}
.pp-card.featured{border-color:var(--brand);background:linear-gradient(135deg,var(--white) 0%,var(--brand-lt) 100%)}

/* GALLERY */
.pp-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pp-gallery-item{border-radius:var(--radius);overflow:hidden;aspect-ratio:1;box-shadow:var(--shadow);transition:transform .22s,box-shadow .22s}
.pp-gallery-item:hover{transform:scale(1.03);box-shadow:var(--shadow-lg)}
.pp-gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.pp-gallery-hero{border-radius:var(--radius);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow-lg)}
.pp-gallery-hero img{width:100%;height:auto;max-height:72vh;object-fit:contain;background:var(--brand-lt)}

/* ABOUT */
.pp-about-inner{display:flex;gap:48px;align-items:center;flex-wrap:wrap}
.pp-about-img-wrap{position:relative;flex-shrink:0}
.pp-about-photo{width:240px;height:240px;border-radius:50%;object-fit:cover;border:4px solid var(--brand);box-shadow:var(--shadow-lg)}
.pp-about-initial{width:240px;height:240px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-family:'Dancing Script',cursive;font-size:100px;color:#fff;font-weight:700;box-shadow:var(--shadow-lg)}
.pp-about-blob{position:absolute;width:260px;height:260px;background:var(--brand-lt);border-radius:60% 40% 50% 50% / 50% 60% 40% 50%;z-index:-1;top:20px;left:20px}
.pp-about-copy{flex:1;min-width:260px}
.pp-about-name{font-family:'Dancing Script',cursive;font-size:clamp(34px,5vw,50px);font-weight:700;color:var(--text);margin-bottom:14px}
.pp-about-bio{font-size:16px;color:var(--muted);line-height:1.75}
.pp-since{display:inline-block;margin-top:16px;font-size:13px;font-weight:700;color:var(--brand);background:var(--brand-lt);padding:5px 16px;border-radius:999px}

/* CONTACT */
.pp-contact{padding:28px 24px;background:var(--cream);border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.pp-contact-in{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.pp-contact-item{display:flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;background:var(--white);border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--text);transition:border-color .18s}
.pp-contact-item:hover{border-color:var(--brand)}

/* REVIEWS */
.pp-reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.pp-review{background:var(--white);border:2px solid var(--line);border-radius:var(--radius);padding:24px;transition:transform .2s,box-shadow .2s}
.pp-review:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.pp-stars{color:var(--gold);font-size:20px;letter-spacing:2px;margin-bottom:12px}
.pp-review-text{font-size:14.5px;color:var(--text);line-height:1.65;font-style:italic;flex:1;margin-bottom:14px}
.pp-review-author{font-size:13px;font-weight:800;color:var(--muted)}

/* FAQ */
.pp-faq{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
details.pp-faq-item{background:var(--white);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:border-color .18s}
details.pp-faq-item[open]{border-color:var(--brand)}
summary.pp-faq-q{padding:18px 22px;font-size:15px;font-weight:800;color:var(--text);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;user-select:none}
summary.pp-faq-q::-webkit-details-marker{display:none}
summary.pp-faq-q::after{content:'＋';font-size:18px;color:var(--brand);flex-shrink:0}
details.pp-faq-item[open] summary.pp-faq-q::after{content:'－'}
.pp-faq-a{padding:0 22px 18px;font-size:14.5px;color:var(--muted);line-height:1.7}

/* CTA */
.pp-cta{padding:80px 24px;text-align:center;background:var(--brand);position:relative;overflow:hidden}
.pp-cta::before{content:'🎉';position:absolute;font-size:220px;opacity:.07;top:-30px;right:-20px;pointer-events:none}
.pp-cta-in{position:relative;max-width:600px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:18px}
.pp-cta-h{font-family:'Dancing Script',cursive;font-size:clamp(40px,7vw,70px);font-weight:700;color:#fff;line-height:1.05}
.pp-cta-sub{font-size:17px;color:rgba(255,255,255,.85)}
.pp-cta-btn{display:inline-flex;align-items:center;background:#fff;color:var(--brand);padding:18px 44px;border-radius:999px;font-size:17px;font-weight:800;box-shadow:0 8px 28px rgba(0,0,0,.2);transition:transform .18s,box-shadow .18s}
.pp-cta-btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.28)}

/* FOOTER */
.pp-footer{padding:28px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.pp-footer-biz{font-size:14px;font-weight:700;color:var(--muted)}
.pp-footer-power{font-size:12px;color:var(--muted)}
.pp-footer-power a{color:var(--brand);font-weight:600}
</style>`;

    const logoHTML=d.logo
      ?`<img src="${esc(d.logo)}" class="pp-logo" alt="${esc(d.bizName)}"/>`
      :`<div class="pp-initial">${esc(d.bizName.charAt(0).toUpperCase())}</div>`;

    /* Hero photo */
    let heroPhotoHTML='';
    if(d.heroPhoto)heroPhotoHTML=`<div class="pp-hero-photo-wrap"><img src="${esc(d.heroPhoto)}" alt="${esc(d.bizName)}" loading="lazy"/></div>`;

    /* Niche tag */
    const nicheTagHTML=d.nicheLabel?`<div class="pp-niche-tag">${esc(d.nicheLabel)}</div>`:'';

    /* Packages */
    const EMOJIS=['🎀','🎂','🎠','🎊','✨','🌟'];
    let pkgsHTML='';
    if(d.packages_data){
      d.packages_data.forEach((pkg,i)=>{
        const price=pkg.price!=null?(typeof pkg.price==='number'?'$'+pkg.price:esc(String(pkg.price))):'Ask us!';
        const isFeature=i===1;
        pkgsHTML+=`<div class="pp-card${isFeature?' featured':''}">
          <div class="pp-card-top">
            <div class="pp-card-emoji">${EMOJIS[i%EMOJIS.length]}</div>
            <div class="pp-card-name">${esc(pkg.name||'Package')}</div>
            <div class="pp-card-price">${price}</div>
            ${pkg.duration?`<div class="pp-card-duration">⏱ ${esc(String(pkg.duration))}</div>`:''}
            ${includesList(pkg,'pp-card-includes')}
          </div>
          <a href="${esc(packageBookURL(d.bookURL,pkg))}" class="pp-card-cta">Book This →</a>
        </div>`;
      });
    }else{
      [['🎀','Dream Party','$275','2 hrs','Everything for an amazing celebration'],['🎂','Party Starter','$175','1.5 hrs','Perfect intimate celebration'],['🎠','Grand Party','$450','3 hrs','Full luxury party experience']]
        .forEach(([em,name,price,dur,desc],i)=>{
          pkgsHTML+=`<div class="pp-card${i===1?' featured':''}"><div class="pp-card-top"><div class="pp-card-emoji">${em}</div><div class="pp-card-name">${name}</div><div class="pp-card-price">${price}</div><div class="pp-card-duration">⏱ ${dur}</div><div class="pp-card-desc">${desc}</div></div><a href="${esc(d.bookURL)}" class="pp-card-cta">Book This →</a></div>`;
        });
    }

    /* Add-ons */
    let addonsHTML='';
    if(d.addons.length>0){
      addonsHTML=`<div class="pp-addons-hd">Make it extra ✨</div>
        <div class="pp-addons">${d.addons.map(a=>`<div class="pp-addon"><span class="pp-addon-name">${esc(a.name)}</span>${a.price?`<span class="pp-addon-price">${esc(a.price)}</span>`:''}</div>`).join('')}</div>`;
    }

    /* Gallery */
    let galleryHTML='';
    const gPhotos=d.photos;
    if(d.heroPhoto||gPhotos.length>0){
      const heroHTM=d.heroPhoto?`<div class="pp-gallery-hero"><img src="${esc(d.heroPhoto)}" alt="party photo" loading="lazy"/></div>`:'';
      const thumbsHTM=gPhotos.slice(0,12).map(src=>`<div class="pp-gallery-item"><img src="${esc(src)}" alt="party photo" loading="lazy"/></div>`).join('');
      galleryHTML=`<section class="pp-section pp-section-cream" id="gallery"><div class="pp-max">
        <div class="pp-section-head"><div class="pp-badge">Gallery</div><div class="pp-section-title">A peek at the magic ✨</div></div>
        ${heroHTM}${thumbsHTM?`<div class="pp-gallery">${thumbsHTM}</div>`:''}
      </div></section>`;
    }

    /* About */
    const aImg=d.ownerPhoto||d.logo;
    const aImgHTML=aImg
      ?`<img src="${esc(aImg)}" class="pp-about-photo" alt="${esc(d.ownerName)}" loading="lazy"/>`
      :`<div class="pp-about-initial">${esc(d.ownerName.charAt(0).toUpperCase())}</div>`;
    const sinceHTML=d.about_data.yearStarted?`<div class="pp-since">In business since ${esc(String(d.about_data.yearStarted))}</div>`:'';

    /* Contact */
    const cItems=buildContactItems(d);
    const cHTML=cItems.length>0?`<div class="pp-contact"><div class="pp-contact-in">${cItems.map(c=>`<a href="${esc(c.href)}" class="pp-contact-item" target="_blank" rel="noopener">${c.icon} ${esc(c.label)}</a>`).join('')}</div></div>`:'';

    /* Reviews */
    let revHTML='';
    if(d.reviews_data&&d.reviews_data.length>0){
      revHTML=`<section class="pp-section" id="reviews"><div class="pp-max">
        <div class="pp-section-head"><div class="pp-badge">Reviews</div><div class="pp-section-title">Happy families 💕</div></div>
        <div class="pp-reviews-grid">${d.reviews_data.slice(0,3).map(r=>{const s=Math.min(5,Math.max(1,parseInt(r.rating)||5));return`<div class="pp-review"><div class="pp-stars">${'★'.repeat(s)}</div><div class="pp-review-text">"${esc(r.text||'')}"</div><div class="pp-review-author">— ${esc(r.author||'Happy Family')}</div></div>`}).join('')}
        </div></div></section>`;
    }

    /* FAQ */
    let faqHTML='';
    if(d.faqItems.length>0){
      faqHTML=`<section class="pp-section pp-section-cream" id="faq"><div class="pp-max">
        <div class="pp-section-head"><div class="pp-badge">FAQ</div><div class="pp-section-title">Got questions? 🙋</div></div>
        <div class="pp-faq">${d.faqItems.map(q=>`<details class="pp-faq-item"><summary class="pp-faq-q">${esc(q.q)}</summary><div class="pp-faq-a">${esc(q.a)}</div></details>`).join('')}</div>
      </div></section>`;
    }

    root.innerHTML=css+`
<nav class="pp-nav"><div class="pp-nav-in"><div class="pp-brand">${logoHTML}<span class="pp-biz">${esc(d.bizName)}</span></div><a href="${esc(d.bookURL)}" class="pp-book-btn">Book Now 🎉</a></div></nav>

<section class="pp-hero">
  <div class="pp-blob1"></div>
  <div class="pp-blob2"></div>
  <div class="pp-hero-in">
    ${nicheTagHTML}
    ${heroPhotoHTML}
    <h1 class="pp-h1"><span class="pp-biz-color">${esc(d.bizName)}</span></h1>
    <p class="pp-tagline">${esc(d.tagline)}</p>
    <div class="pp-hero-btns">
      <a href="${esc(d.bookURL)}" class="pp-btn-main">Book Your Party 🎀</a>
      <a href="#services" class="pp-btn-outline">See Packages ↓</a>
    </div>
  </div>
</section>

<section class="pp-section" id="services"><div class="pp-max">
  <div class="pp-section-head"><div class="pp-badge">Packages</div><div class="pp-section-title">Pick your party! 🎂</div><p class="pp-section-sub">Every package is packed with magic. Choose what fits your celebration.</p></div>
  <div class="pp-cards">${pkgsHTML}</div>
  ${addonsHTML}
</div></section>

${galleryHTML}

<section class="pp-section pp-section-cream" id="about"><div class="pp-max">
  <div class="pp-section-head"><div class="pp-badge">About</div><div class="pp-section-title">Meet the magic-maker 🌟</div></div>
  <div class="pp-about-inner">
    <div class="pp-about-img-wrap">${aImgHTML}<div class="pp-about-blob"></div></div>
    <div class="pp-about-copy">
      <div class="pp-about-name">${esc(d.ownerName)}</div>
      <p class="pp-about-bio">${esc(d.ownerBio)}</p>
      ${sinceHTML}
    </div>
  </div>
</div></section>

${cHTML}

${revHTML}

${faqHTML}

<section class="pp-cta"><div class="pp-cta-in">

</div></section>

<style id="tpl-css">

.st-h1{font-size:clamp(36px,5vw,64px);font-weight:900;color:var(--text);line-height:1.05;letter-spacing:-.03em;margin-bottom:20px}
.st-h1 span{color:var(--brand)}
.st-tagline{font-size:clamp(15px,2vw,18px);color:var(--muted);margin-bottom:36px;max-width:440px;line-height:1.7}
.st-hero-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.st-btn-primary{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;padding:14px 30px;border-radius:var(--radius);font-size:15px;font-weight:700;transition:background .18s,transform .18s;box-shadow:0 4px 16px rgba(0,0,0,.14)}
.st-btn-primary:hover{background:var(--brand-dk);transform:translateY(-1px)}
.st-btn-text{font-size:14px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:color .18s}
.st-btn-text:hover{color:var(--brand)}
@media(max-width:760px){
  .st-hero{grid-template-columns:1fr;min-height:auto}
  .st-hero-left{padding:60px 24px;justify-content:center;text-align:center}
  .st-hero-content{max-width:100%}
  .st-hero-tag{justify-content:center}
  .st-hero-actions{justify-content:center}
  .st-hero-right{display:none}
}

/* SECTIONS */
.st-section{padding:80px 32px}
.st-section-alt{background:var(--cream)}
.st-max{max-width:1200px;margin:0 auto}
.st-section-hd{margin-bottom:48px}
.st-section-hd.center{text-align:center}
.st-section-hd.center .st-section-sub{margin:0 auto}
.st-eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.st-section-title{font-size:clamp(24px,4vw,38px);font-weight:900;color:var(--text);letter-spacing:-.025em;line-height:1.15;margin-bottom:10px}
.st-section-sub{font-size:15px;color:var(--muted);max-width:440px;line-height:1.65}

/* LIST CARDS (packages) */
.st-pkg-list{display:flex;flex-direction:column;gap:12px}
.st-pkg{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:24px 28px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);border-left:4px solid var(--brand);transition:box-shadow .2s,border-color .2s}
.st-pkg:hover{box-shadow:var(--shadow-lg);border-color:var(--brand)}
.st-pkg-info{}
.st-pkg-name{font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.01em;margin-bottom:4px}
.st-pkg-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.st-pkg-pill{font-size:11px;font-weight:700;color:var(--muted);background:var(--cream);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.st-pkg-includes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.st-pkg-includes li{font-size:13px;color:var(--muted);line-height:1.5;padding-left:19px;position:relative}
.st-pkg-includes li::before{content:'✓';position:absolute;left:0;top:0;color:var(--brand);font-weight:800}

/* ADD-ONS */
.st-addons-hd{margin:40px 0 14px;font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.01em}
.st-addons{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.st-addon{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);transition:box-shadow .2s,border-color .2s}
.st-addon:hover{box-shadow:var(--shadow);border-color:var(--brand)}
.st-addon-name{font-size:14px;font-weight:700;color:var(--text)}
.st-addon-price{font-size:17px;font-weight:900;color:var(--brand);white-space:nowrap}
.st-pkg-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.st-pkg-price{font-size:28px;font-weight:900;color:var(--brand);letter-spacing:-.02em;white-space:nowrap}
.st-pkg-cta{background:var(--brand);color:#fff;padding:10px 20px;border-radius:var(--radius);font-size:13px;font-weight:700;transition:background .18s;white-space:nowrap;text-align:center}
.st-pkg-cta:hover{background:var(--brand-dk)}
@media(max-width:600px){.st-pkg{grid-template-columns:1fr;gap:14px}.st-pkg-right{align-items:flex-start}.st-pkg-cta{width:100%;text-align:center}}

/* GALLERY */
.st-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.st-gallery-hero{border-radius:var(--radius);overflow:hidden;margin-bottom:10px}
.st-gallery-hero img{width:100%;height:auto;max-height:72vh;object-fit:contain;background:var(--cream)}
.st-gallery-item{border-radius:var(--radius);overflow:hidden;aspect-ratio:1;transition:transform .2s}
.st-gallery-item:hover{transform:scale(1.02)}
.st-gallery-item img{width:100%;height:100%;object-fit:cover;display:block}

/* ABOUT */
.st-about-grid{display:grid;grid-template-columns:280px 1fr;gap:64px;align-items:center}
.st-about-photo{width:280px;height:280px;border-radius:var(--radius);object-fit:cover;box-shadow:var(--shadow-lg)}
.st-about-initial{width:280px;height:280px;border-radius:var(--radius);background:var(--brand-lt);display:flex;align-items:center;justify-content:center;font-size:100px;font-weight:900;color:var(--brand)}
.st-about-copy{}
.st-about-name{font-size:30px;font-weight:900;color:var(--text);letter-spacing:-.025em;margin-bottom:16px}
.st-about-bio{font-size:16px;color:var(--muted);line-height:1.75}
.st-since{display:inline-block;margin-top:16px;font-size:13px;font-weight:700;color:var(--muted)}
@media(max-width:680px){.st-about-grid{grid-template-columns:1fr}.st-about-photo,.st-about-initial{width:100%;height:200px}}

/* CONTACT */
.st-contact{padding:24px 32px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.st-contact-in{max-width:900px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.st-contact-item{display:flex;align-items:center;gap:7px;padding:9px 18px;border-radius:var(--radius);background:var(--cream);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text);transition:border-color .18s}
.st-contact-item:hover{border-color:var(--brand);color:var(--brand)}

/* REVIEWS */
.st-reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.st-review{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:24px;transition:box-shadow .2s}
.st-review:hover{box-shadow:var(--shadow)}
.st-stars{color:#F59E0B;font-size:15px;letter-spacing:2px;margin-bottom:12px}
.st-review-text{font-size:14.5px;color:var(--text);line-height:1.65;font-style:italic;margin-bottom:14px}
.st-review-author{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-top:1px solid var(--line);padding-top:10px}

/* FAQ */
.st-faq{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
details.st-faq-item{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
details.st-faq-item[open]{border-color:var(--brand);box-shadow:var(--shadow)}
summary.st-faq-q{padding:18px 20px;font-size:15px;font-weight:700;color:var(--text);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;user-select:none}
summary.st-faq-q::-webkit-details-marker{display:none}
summary.st-faq-q::after{content:'+';font-size:20px;font-weight:300;color:var(--brand);flex-shrink:0}
details.st-faq-item[open] summary.st-faq-q::after{content:'−'}
.st-faq-a{padding:0 20px 18px;font-size:14.5px;color:var(--muted);line-height:1.7}

/* CTA */
.st-cta{padding:80px 32px;background:var(--brand);text-align:center}
.st-cta-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.st-cta-h{font-size:clamp(30px,5vw,52px);font-weight:900;color:#fff;letter-spacing:-.025em;line-height:1.1}
.st-cta-sub{font-size:17px;color:rgba(255,255,255,.8)}
.st-cta-btn{display:inline-flex;align-items:center;background:#fff;color:var(--brand);padding:16px 40px;border-radius:var(--radius);font-size:16px;font-weight:800;transition:transform .18s,box-shadow .18s;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.st-cta-btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.22)}

/* FOOTER */
.st-footer{padding:28px 32px;border-top:1px solid var(--line);display:flex;justify-content:center;flex-direction:column;align-items:center;gap:6px}
.st-footer-biz{font-size:14px;font-weight:700;color:var(--muted)}
.st-footer-power{font-size:12px;color:var(--muted)}
.st-footer-power a{color:var(--brand);font-weight:600}

  function garden_bunting(colors,cls){
    // Pennants hung along a gently sagging string (quadratic curve).
    const P0=[0,10],P1=[600,62],P2=[1200,10];
    const pt=t=>[(1-t)*(1-t)*P0[0]+2*(1-t)*t*P1[0]+t*t*P2[0],(1-t)*(1-t)*P0[1]+2*(1-t)*t*P1[1]+t*t*P2[1]];
    const n=22,flags=[];
    for(let i=0;i<n;i++){
      const t0=(i+.12)/n,t1=(i+.88)/n,a=pt(t0),b=pt(t1),m=[(a[0]+b[0])/2,(a[1]+b[1])/2+40];
      flags.push('<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+'L'+b[0].toFixed(1)+' '+b[1].toFixed(1)+'L'+m[0].toFixed(1)+' '+m[1].toFixed(1)+'Z" fill="'+colors[i%colors.length]+'"/>');
    }
    return'<svg class="'+cls+'" viewBox="0 0 1200 90" preserveAspectRatio="xMidYMin slice" aria-hidden="true" focusable="false"><path d="M0 10Q600 62 1200 10" fill="none" stroke="currentColor" stroke-width="1.5"/>'+flags.join('')+'</svg>';
  }

.gd-btn{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;padding:15px 30px;border-radius:14px;font-size:16px;font-weight:700;transition:background .18s,transform .25s,box-shadow .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 var(--accent-dk),0 8px 14px -4px ${tpl3_rgba(accent,.35)},0 18px 30px -14px ${tpl3_rgba(accent,.5)}}
.gd-btn:hover{background:var(--accent-dk);transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 5px 0 ${tpl3_mix(accent,'#000000',.35)},0 14px 22px -6px ${tpl3_rgba(accent,.4)},0 26px 40px -16px ${tpl3_rgba(accent,.55)}}
.gd-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-dk)}
.gd-btn-sm{padding:10px 18px;font-size:15px;flex-shrink:0}
.gd-btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.gd-btn-ghost:hover{background:var(--ink);color:var(--linen)}

/* HERO */
.gd-hero{position:relative;background:radial-gradient(60% 70% at 80% 55%,${tpl3_rgba(d.brand,.12)},transparent 70%),var(--linen)}
.gd-hero-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.gd-edge{position:absolute;left:0;bottom:-1px;width:100%;height:clamp(40px,6vw,86px);display:block;z-index:1}
.gd-edge-top{position:absolute;left:0;top:1px;transform:translateY(-100%);width:100%;height:clamp(16px,2.6vw,30px);display:block}
.gd-bunting{display:block;width:100%;height:84px;color:${tpl3_rgba(ink,.45)}}
.gd-hero-in{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:40px 28px 120px;display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.gd-kicker{display:inline-flex;align-items:center;gap:10px;font-weight:700;color:var(--sage-ink);font-size:16px;margin-bottom:18px}
.gd-kicker svg{width:30px;height:30px}
.gd-h1{font-family:var(--serif);font-weight:600;font-size:clamp(46px,6.8vw,92px);line-height:.98;letter-spacing:-.02em;margin-bottom:24px;overflow-wrap:break-word}
.gd-tag{font-size:20px;color:var(--muted);max-width:28em;margin-bottom:34px}
.gd-actions{display:flex;flex-wrap:wrap;gap:14px}
.gd-facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;list-style:none}
.gd-facts li{font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;background:var(--paper);border:1px solid var(--line)}
.gd-art{position:relative;justify-self:center;width:100%;max-width:440px;aspect-ratio:1;transform:translateY(120px)}
.gd-blanket2{position:absolute;inset:8% 6% 2% 8%;border-radius:22px;transform:rotate(5deg);background:var(--oat);box-shadow:var(--sh2)}
.gd-blanket{position:absolute;inset:6% 4% 4% 6%;border-radius:22px;transform:rotate(-6deg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),var(--sh3)}
.gd-sun{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--accent);background:radial-gradient(circle at 38% 30%,#fff,var(--paper) 55%,${tpl3_mix(paper,'#d9c39c',.35)});box-shadow:0 0 0 10px ${tpl3_rgba(paper,.55)},var(--sh3)}
.gd-sun svg{width:62%;height:auto}
.gd-dot{position:absolute;border-radius:50%;box-shadow:inset -4px -6px 10px rgba(0,0,0,.12),inset 4px 5px 8px rgba(255,255,255,.45),var(--sh1)}
.gd-leaf{position:absolute;width:64px;height:30px;background:#8E9C6E;border-radius:0 100% 0 100%}
.gd-photo-wrap{position:relative;justify-self:center;width:100%;max-width:480px;transform:translateY(120px);isolation:isolate}
.gd-photo-wrap::before{content:'';position:absolute;inset:0;border-radius:26px;background:var(--oat);transform:rotate(4deg) translate(14px,10px);box-shadow:var(--sh2);z-index:-1}
.gd-photo{position:relative;width:100%;padding:14px;border-radius:26px;transform:rotate(-2deg);box-shadow:var(--sh3)}
.gd-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px}

/* SECTIONS */
.gd-sec{padding:96px 0;position:relative}
#services{padding-top:200px}
.gd-sec-oat{background:var(--oat)}
.gd-hd{text-align:center;max-width:640px;margin:0 auto 52px;position:relative}
.gd-hd>*{position:relative}
.gd-hd::before{content:'';position:absolute;left:50%;top:50%;width:120%;height:170px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,${tpl3_rgba(mustard,.22)},transparent);pointer-events:none}
.gd-h2{font-family:var(--serif);font-weight:600;font-size:clamp(34px,4.6vw,54px);line-height:1.06;letter-spacing:-.015em}
.gd-sub{color:var(--muted);margin-top:14px;font-size:18px}

/* PACKAGE TICKETS */
.gd-tickets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:28px;align-items:start}
.gd-tk{position:relative;isolation:isolate;display:flex}
.gd-tk::before{content:'';position:absolute;inset:0;border-radius:20px;background:var(--tint);transform:rotate(-2.4deg) translate(-6px,8px);box-shadow:var(--sh1);z-index:-1;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.gd-ticket{--bg:var(--oat);position:relative;width:100%;background:var(--paper);border-radius:20px;overflow:hidden;box-shadow:var(--sh2);display:flex;flex-direction:column;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
@media(hover:hover){.gd-tk:hover .gd-ticket{transform:translateY(-8px) rotate(.4deg);box-shadow:var(--sh3)}.gd-tk:hover::before{transform:rotate(-3.6deg) translate(-10px,10px)}}
.gd-ticket-strip{height:14px}
.gd-ticket-top{padding:24px 28px 22px}
.gd-ticket-name{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.15}
.gd-ticket-meta{font-size:15px;font-weight:600;color:var(--sage-ink);margin-top:6px}
.gd-ticket-price{font-family:var(--serif);font-size:46px;font-weight:600;color:var(--accent);line-height:1;margin-top:16px;letter-spacing:-.02em}
.gd-ticket-cut{position:relative;height:0;border-top:2px dashed ${tpl3_rgba(ink,.2)};margin:0 22px}
.gd-ticket-cut::before,.gd-ticket-cut::after{content:'';position:absolute;top:-15px;width:28px;height:28px;border-radius:50%;background:var(--bg)}
.gd-ticket-cut::before{left:-37px}.gd-ticket-cut::after{right:-37px}
.gd-ticket-bot{padding:22px 28px 28px;display:flex;flex-direction:column;gap:20px;flex:1}
.gd-incl{list-style:none;display:flex;flex-direction:column;gap:8px}
.gd-incl li{position:relative;padding-left:28px;font-size:16px}
.gd-incl li::before{content:'';position:absolute;left:2px;top:.45em;width:14px;height:8px;border-left:2.5px solid var(--sage-ink);border-bottom:2.5px solid var(--sage-ink);transform:rotate(-45deg)}
.gd-ticket .gd-btn{width:100%;margin-top:auto}
.gd-extras{margin:52px auto 0;max-width:760px;background:var(--paper);border-radius:20px;padding:30px 34px;box-shadow:var(--sh2)}
.gd-extras h3{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:8px}
.gd-extras-list{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
.gd-extra{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.gd-extra-name{flex:1}
.gd-extra-price{font-weight:700;color:var(--accent)}
.gd-empty{max-width:560px;margin:0 auto;text-align:center;background:var(--paper);border-radius:22px;padding:44px 32px}
.gd-empty p{color:var(--muted);margin:12px 0 26px}

/* GALLERY — snapshots */
.gd-snaps{display:flex;flex-wrap:wrap;justify-content:center;gap:28px}
.gd-snap{width:calc((100% - 56px)/3);max-width:340px;background:#fff;padding:10px 10px 12px;box-shadow:var(--sh2);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
@media(hover:hover){.gd-snap:hover{transform:translateY(-8px) rotate(0)!important;box-shadow:var(--sh3)}}
.gd-snap:nth-child(3n+1){transform:rotate(-1.6deg)}
.gd-snap:nth-child(3n+2){transform:rotate(1.2deg) translateY(10px)}
.gd-snap:nth-child(3n){transform:rotate(-.6deg)}
.gd-snap img{width:100%;aspect-ratio:1;object-fit:cover}

/* ABOUT */
.gd-about{display:grid;grid-template-columns:.85fr 1.15fr;gap:72px;align-items:center}
.gd-about-photo{position:relative;padding:12px;border-radius:999px 999px 24px 24px;max-width:400px;justify-self:center;width:100%;box-shadow:var(--sh3)}
.gd-about-photo::before{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--paper);transform:rotate(-4deg) translate(-16px,10px);box-shadow:var(--sh1);z-index:-1}
.gd-about{isolation:isolate}
.gd-about-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 16px 16px}
.gd-about-solo{max-width:680px;margin:0 auto;text-align:center}
.gd-badge{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);box-shadow:inset 0 0 0 6px var(--paper)}
.gd-badge svg{width:44px;height:44px}
.gd-bio{font-size:18px;color:var(--muted);margin-top:18px;white-space:pre-line}
.gd-since{display:inline-block;margin-top:20px;font-weight:700;color:var(--sage-ink)}

/* REVIEWS */
.gd-revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.gd-revs-one{max-width:720px;margin:0 auto;grid-template-columns:1fr}
.gd-rev{background:var(--paper);border-radius:20px;padding:34px 32px 28px;position:relative;box-shadow:var(--sh1);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
@media(hover:hover){.gd-rev:hover{transform:translateY(-6px);box-shadow:var(--sh3)}}
.gd-rev::before{content:'\\201C';position:absolute;top:6px;left:24px;font-family:var(--serif);font-size:84px;line-height:1;color:var(--mustard)}
.gd-rev blockquote{font-family:var(--serif);font-size:22px;line-height:1.45;margin-top:34px}
.gd-rev .tpl3-stars{display:block;color:${starInk};letter-spacing:2px;margin-top:18px}
.gd-rev-who{font-weight:700;margin-top:6px}
.gd-rev-who span{font-weight:400;color:var(--muted)}

/* FAQ */
.gd-faq{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.gd-faq details{background:var(--paper);border-radius:16px;box-shadow:0 0 0 1px var(--line),var(--sh1)}
.gd-faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.3}
.gd-faq summary::-webkit-details-marker{display:none}
.gd-faq summary::after{content:'+';flex-shrink:0;width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--ink);font-family:var(--sans);font-size:22px;line-height:32px;text-align:center}
.gd-faq details[open] summary::after{content:'−'}
.gd-faq-a{padding:0 24px 22px;color:var(--muted);white-space:pre-line}

/* CTA */
.gd-cta{position:relative;margin-top:40px;background:radial-gradient(55% 70% at 50% 62%,${tpl3_rgba(tpl3_mix(accent,'#ffffff',.3),.35)},transparent 70%),var(--deep);color:var(--linen);text-align:center;padding:0 0 96px}
.gd-cta .gd-max{position:relative}
.gd-badge{box-shadow:inset 0 0 0 6px var(--paper),var(--sh2)!important}
.gd-badge svg{width:56px!important;height:56px!important}
.gd-cta .gd-bunting{color:${tpl3_rgba(linen,.5)};margin-bottom:40px}
.gd-cta .gd-sub{color:${tpl3_rgba(linen,.86)};max-width:32em;margin:14px auto 32px}
.gd-btn-light{background:var(--linen);color:var(--ink);box-shadow:0 3px 0 ${tpl3_rgba('#000000',.35)}}
.gd-btn-light:hover{background:#fff}
.gd-reach{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 26px;margin-top:32px}
.gd-reach a{color:var(--linen);border-bottom:1px solid ${tpl3_rgba(linen,.45)}}
.gd-reach a:hover{border-color:var(--linen)}

/* FOOTER */
.gd-foot{padding:34px 28px;text-align:center;background:var(--linen);border-top:1px solid var(--line)}
.gd-foot-biz{font-family:var(--serif);font-size:21px;font-weight:600}
.gd-foot-power{font-size:14px;color:var(--muted);margin-top:4px}
.gd-foot-power a{color:var(--ink);border-bottom:1px solid var(--line)}

@media(max-width:900px){
  .gd-links{display:none}
  .gd-hero-in{grid-template-columns:1fr;gap:48px;padding:28px 24px 100px}
  .gd-art,.gd-photo-wrap{transform:translateY(90px)}
  #services{padding-top:170px}
  .gd-art{max-width:360px}
  .gd-photo-wrap{max-width:400px}
  .gd-about{grid-template-columns:1fr;gap:48px}
  .gd-snap{width:calc((100% - 28px)/2)}
}
@media(max-width:600px){
  body{font-size:16px}
  .gd-max{padding:0 20px}
  .gd-nav-in{padding:10px 16px;gap:12px}
  .gd-biz{font-size:18px}
  .gd-bunting{height:60px}
  .gd-hero-in{padding:20px 20px 72px}
  .gd-art,.gd-photo-wrap{transform:translateY(36px)}
  .gd-hero-in{gap:12px}
  #services{padding-top:104px}
  .gd-photo-wrap{max-width:320px}
  .gd-photo-wrap::before{transform:rotate(3deg) translate(8px,8px)}
  .gd-about-photo::before{transform:rotate(-3deg) translate(-8px,8px)}
  .tpl3-float.gd-dt{display:none}
  .gd-tag{font-size:18px}
  .gd-art{max-width:300px}
  .gd-sec{padding:72px 0}
  .gd-tickets{grid-template-columns:1fr}
  .gd-ticket-top,.gd-ticket-bot{padding-left:22px;padding-right:22px}
  .gd-extras{padding:24px 20px}
  .gd-extras-list{grid-template-columns:1fr}
  .gd-snaps{gap:16px}
  .gd-snap{width:calc((100% - 16px)/2);padding:6px 6px 8px}
  .gd-rev blockquote{font-size:20px}
  .gd-faq summary{font-size:19px;padding:18px 18px}
  .gd-faq-a{padding:0 18px 20px}
  .gd-cta{padding-bottom:72px}
}
@media(prefers-reduced-motion:reduce){.gd *{transition:none!important}}

      ?`<div class="bl-vis">${bloom_confetti(d.brand)}<div class="bl-blob-back"></div><div class="bl-blob"><img src="${esc(d.heroPhoto)}" alt="A party by ${esc(d.bizName)}"/></div><div class="bl-mini" aria-hidden="true">${tpl3_icon(d.nicheLabel,d.brand)}</div></div>`
      :`<div class="bl-vis" aria-hidden="true">${bloom_confetti(d.brand)}<div class="bl-sticker-back"></div><div class="bl-sticker">${d.logo?`<img src="${esc(d.logo)}" alt=""/>`:tpl3_icon(d.nicheLabel,d.brand)}</div></div>`;

    let pkgHTML='';
    if(p.pkgs.length){
      pkgHTML=`<div class="bl-cards tpl3-rv">${p.pkgs.map(pkg=>{
        const meta=tpl3_pkgMeta(pkg);
        return`<article class="bl-card"><div class="bl-card-hd"><h3 class="bl-card-name">${esc(pkg.name||'Package')}</h3><div class="bl-card-price">${esc(tpl3_money(pkg.price)||'Ask for pricing')}</div>${meta.length?`<div class="bl-chips">${meta.map(m=>`<span class="bl-chip">${m}</span>`).join('')}</div>`:''}</div>
          <div class="bl-card-bd">${includesList(pkg,'bl-incl')}<a href="${esc(packageBookURL(d.bookURL,pkg))}" class="bl-btn tpl3-sheen">Book this package</a></div></article>`;}).join('')}</div>`;
      if(d.addons.length)pkgHTML+=`<div class="bl-addons tpl3-rv"><h3>Add-ons</h3><ul class="bl-addon-row">${d.addons.map(a=>`<li>${esc(a.name)}${a.price?`<b>${esc(a.price)}</b>`:''}</li>`).join('')}</ul></div>`;
    }else{
      pkgHTML=`<div class="bl-empty tpl3-rv" style="box-shadow:var(--sh2)"><h3 class="bl-h2" style="font-size:32px">Packages coming soon</h3><p>Tell us about your party and we'll send you a quote.</p><a href="${esc(d.bookURL)}" class="bl-btn">Request a quote</a></div>`;
    }

    let bloom_alt=1;const bloom_bg=()=>(bloom_alt++%2?' bl-sec-cream':'');
    const bloom_open=id=>{const bg=bloom_bg();return`<section class="bl-sec${bg}" id="${id}">${bg?tpl3_edge('scallop',cream,'bl-edge-top'):''}`};
    const galleryHTML=p.photos.length?`${bloom_open('gallery')}<div class="bl-max"><div class="bl-hd tpl3-rv"><h2 class="bl-h2">Party gallery</h2></div><div class="bl-gal tpl3-rv">${p.photos.map((src,i)=>`<figure><img src="${esc(src)}" alt="Party photo ${i+1}" loading="lazy"/></figure>`).join('')}</div></div></section>`:'';
    let aboutHTML='';
    if(p.bio||d.ownerPhoto){
      const bg=bloom_bg();
      const copy=`<h2 class="bl-h2">${p.ownerName?`Meet ${esc(p.ownerName)}`:`About ${esc(d.bizName)}`}</h2>${p.bio?`<p class="bl-bio">${esc(p.bio)}</p>`:''}${p.since?`<span class="bl-since">Hosting parties since ${esc(p.since)}</span>`:''}`;
      aboutHTML=d.ownerPhoto
        ?`<section class="bl-sec${bg}" id="about">${bg?tpl3_edge('scallop',cream,'bl-edge-top'):''}<div class="bl-max"><div class="bl-about tpl3-rv"><div class="bl-about-fig"><img src="${esc(d.ownerPhoto)}" class="bl-about-img" alt="${esc(p.ownerName||d.bizName)}" loading="lazy"/></div><div>${copy}</div></div></div></section>`
        :`<section class="bl-sec${bg}" id="about">${bg?tpl3_edge('scallop',cream,'bl-edge-top'):''}<div class="bl-max"><div class="bl-about-solo tpl3-rv"><div class="bl-about-mark" aria-hidden="true">${tpl3_icon(d.nicheLabel,d.brand)}</div>${copy}</div></div></section>`;
    }
    const revHTML=p.reviews.length?`${bloom_open('reviews')}<div class="bl-max"><div class="bl-hd tpl3-rv"><h2 class="bl-h2">What families say</h2></div>
      <div class="tpl3-rv bl-revs${p.reviews.length===1?' bl-revs-one':''}">${p.reviews.slice(0,6).map(r=>`<figure class="bl-rev">${tpl3_stars(r.rating)}<blockquote>${esc(r.text)}</blockquote>${r.name||r.event?`<figcaption class="bl-rev-who">${esc(r.name)}${r.event?`<span>${r.name?', ':''}${esc(r.event)}</span>`:''}</figcaption>`:''}</figure>`).join('')}</div></div></section>`:'';
    const faqHTML=d.faqItems.length?`${bloom_open('faq')}<div class="bl-max"><div class="bl-hd tpl3-rv"><h2 class="bl-h2">Questions, answered</h2></div><div class="bl-faq tpl3-rv">${d.faqItems.map(q=>`<details><summary>${esc(q.q)}</summary><div class="bl-faq-a">${esc(q.a)}</div></details>`).join('')}</div></div></section>`:'';
    const reachHTML=p.contacts.length?`<div class="bl-reach">${p.contacts.map(c=>`<a href="${esc(c.href)}" target="_blank" rel="noopener">${esc(c.label)}</a>`).join('')}</div>`:'';

    root.innerHTML=css+`<div class="bl"><div class="tpl3-grain" aria-hidden="true"></div>
<nav class="bl-nav" aria-label="Main"><div class="bl-nav-in">
  <a href="#top" class="bl-brand">${markHTML}<span class="bl-biz">${esc(d.bizName)}</span></a>
  <div class="bl-links">${tpl3_nav('bl',d,p,!!galleryHTML)}</div>
  <a href="${esc(d.bookURL)}" class="bl-btn bl-btn-sm tpl3-sheen">Book now</a>
</div></nav>

<header class="bl-hero" id="top"><div class="bl-hero-in">
  <div>
    ${pill?`<p class="bl-pill">${tpl3_icon(d.nicheLabel,'#ffffff')}${esc(pill)}</p>`:''}
    <h1 class="bl-h1">${esc(d.bizName)}</h1>
    <p class="bl-tag">${esc(d.tagline)}</p>
    <div class="bl-actions"><a href="${esc(d.bookURL)}" class="bl-btn bl-btn-white tpl3-sheen">Book your party</a>${p.pkgs.length?`<a href="#services" class="bl-btn bl-btn-outline">See packages</a>`:''}</div>
    ${p.facts.length?`<ul class="bl-facts">${p.facts.map(f=>`<li>${esc(f.label)}</li>`).join('')}</ul>`:''}
  </div>
  ${visHTML}
</div>
${tpl3_edge('scallop',cream,'bl-edge')}
</header>

<section class="bl-how" id="how"><div class="bl-max"><div class="bl-panel">
  <div class="bl-hd"><h2 class="bl-h2">How booking works</h2></div>
  <ol class="bl-steps">
    <li class="bl-step"><h3>Choose a package</h3><p>${p.pkgs.length?'Compare the packages and add-ons below.':'Tell us what kind of party you have in mind.'}</p></li>
    <li class="bl-step"><h3>Request your date</h3><p>Share your party details through the booking form.</p></li>
    <li class="bl-step"><h3>Get ready to celebrate</h3><p>We'll confirm the details with you before the big day.</p></li>
  </ol>
</div></div></section>

<section class="bl-sec" id="services"><div class="bl-max">
  <div class="bl-hd tpl3-rv"><h2 class="bl-h2">Party packages</h2>${p.pkgs.length?`<p class="bl-sub">Pick your package, then add any extras you'd like.</p>`:''}</div>
  ${pkgHTML}
</div></section>

${galleryHTML}
${aboutHTML}
${revHTML}
${faqHTML}

<section class="bl-cta"><div class="bl-max"><div class="bl-cta-card tpl3-rv">
  <span class="bl-cf bl-cf-ring" aria-hidden="true" style="width:160px;height:160px;top:-50px;right:-40px"></span>
  <span class="bl-cf bl-cta-dot" aria-hidden="true" style="width:40px;height:40px;bottom:28px;left:36px;background:#FFD166"></span>
  <h2 class="bl-h2">Ready to book the party?</h2>
  <p class="bl-sub">${p.pkgs.length?'Choose a package and request your date in a few minutes.':'Request your date and we\'ll follow up with a quote.'}</p>
  <a href="${esc(d.bookURL)}" class="bl-btn bl-btn-white tpl3-sheen">Book your party</a>
  ${reachHTML}
</div></div></section>

<footer class="bl-foot"><div class="bl-foot-biz">${esc(d.bizName)}</div><div class="bl-foot-power">Powered by <a href="https://partybizhub.com" target="_blank" rel="noopener">Party Biz Hub</a></div></footer>
</div>`;
    tpl3_reveal(root.querySelector('.bl'));
  }

  /* ── Shared: quick-contact form section (injected into every template before footer) ── */
  function buildContactSection(d,ownerId){
    const g=d.brand||'#6D28D9';
    const gLight=hexToRgba(g,.08);
    const cityLine=d.city?' We proudly serve <strong>'+esc(d.city)+'</strong> and the surrounding area.':'';
    return `
<section id="pbh-ask" style="padding:72px 28px;background:#f8f5fc">
<style>
#pbh-ask input,#pbh-ask textarea{width:100%;padding:13px 16px;border:1.5px solid #ede5f5;border-radius:10px;font-size:15px;font-family:inherit;background:#fff;transition:border-color .18s;outline:none;box-sizing:border-box}
#pbh-ask input:focus,#pbh-ask textarea:focus{border-color:${g}}
#pbh-ask textarea{resize:vertical;min-height:110px}
#pbh-ask-btn{background:${g};color:#fff;padding:14px 40px;border-radius:10px;font-size:16px;font-weight:700;border:none;cursor:pointer;transition:opacity .18s;font-family:inherit}
#pbh-ask-btn:hover{opacity:.88}
#pbh-ask-btn:disabled{opacity:.6;cursor:not-allowed}
</style>
<div style="max-width:580px;margin:0 auto">
  <div style="text-align:center;margin-bottom:32px">
    <div style="display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:${g};margin-bottom:10px;padding:4px 16px;background:${gLight};border-radius:999px">Send a Message</div>
    <h2 style="font-size:clamp(22px,4vw,32px);font-weight:900;color:#1a1020;margin-bottom:10px;letter-spacing:-.02em;font-family:inherit">Have a question?</h2>
    <p style="font-size:15px;color:#6b5b73;line-height:1.65;max-width:420px;margin:0 auto">Not ready to book yet? Ask us anything — we reply within 24 hours. ${cityLine}</p>
  </div>
  <form id="pbh-ask-form" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <input id="pbh-c-name" type="text" placeholder="Your name" required autocomplete="name"/>
      <input id="pbh-c-email" type="email" placeholder="Your email" required autocomplete="email"/>
    </div>
    <textarea id="pbh-c-msg" placeholder="What's your question?" required></textarea>
    <div style="text-align:center;margin-top:4px">
      <button type="submit" id="pbh-ask-btn">Send Message →</button>
    </div>
    <div id="pbh-c-result" style="display:none;padding:14px 16px;border-radius:10px;font-size:14px;font-weight:600;text-align:center"></div>
  </form>
</div>
</section>
<script>
(function(){
  var form=document.getElementById('pbh-ask-form');
  if(!form)return;
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var btn=document.getElementById('pbh-ask-btn');
    var res=document.getElementById('pbh-c-result');
    btn.textContent='Sending…';btn.disabled=true;
    var sc=window.supabase.createClient('${SUPA_URL}','${SUPA_ANON}');
    var r=await sc.from('bookings').insert({
      owner_id:'${ownerId}',
      client_name:document.getElementById('pbh-c-name').value,
      client_email:document.getElementById('pbh-c-email').value,
      notes:document.getElementById('pbh-c-msg').value,
      service_name:'General Inquiry',
      status:'new'
    });
    if(r.error){
      res.style.cssText='display:block;padding:14px 16px;border-radius:10px;font-size:14px;font-weight:600;text-align:center;background:#fef2f2;color:#b91c1c';
      res.textContent='Something went wrong — please try again or reach out directly.';
      btn.textContent='Send Message →';btn.disabled=false;
    }else{
      form.innerHTML='<div style="text-align:center;padding:20px;font-size:1rem;font-weight:700;color:#166534">✓ Message sent! We\\'ll get back to you within 24 hours. 🎉</div>';
    }
  });
})();
<\/script>`;
  }

  /* ── Shared: build contact items array ── */
  function buildContactItems(d){
    const items=[];
    if(d.phone)items.push({href:'tel:'+d.phone.replace(/\D/g,''),icon:'📞',label:d.phone});
    if(d.email)items.push({href:'mailto:'+d.email,icon:'✉️',label:d.email});
    if(d.socialInstagram){const h=d.socialInstagram.replace(/^@/,'');items.push({href:'https://instagram.com/'+encodeURIComponent(h),icon:'📸',label:'@'+h})}
    if(d.socialTiktok){const h=d.socialTiktok.replace(/^@/,'');items.push({href:'https://tiktok.com/@'+encodeURIComponent(h),icon:'🎵',label:'@'+h})}
    if(d.socialFacebook){const href=d.socialFacebook.startsWith('http')?d.socialFacebook:'https://facebook.com/'+encodeURIComponent(d.socialFacebook.replace(/^@/,''));items.push({href,icon:'👍',label:d.socialFacebook.replace(/^@/,'')})}
    if(d.socialYoutube){const href=d.socialYoutube.startsWith('http')?d.socialYoutube:'https://youtube.com/'+encodeURIComponent(d.socialYoutube.replace(/^@/,''));items.push({href,icon:'▶️',label:d.socialYoutube})}
    if(d.socialCustom)items.push({href:d.socialCustom.startsWith('http')?d.socialCustom:'https://'+d.socialCustom,icon:'🔗',label:d.socialCustom});
    return items;
  }

})();
</script>
</body>
</html>
