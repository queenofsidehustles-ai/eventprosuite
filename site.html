<!DOCTYPE html>

<title>Loading…</title>

html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#fff}
img{max-width:100%;display:block}
a{text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none}

/* Loading gate */
#loading-gate{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999;transition:opacity .35s ease}
#loading-gate.fade-out{opacity:0;pointer-events:none}
.spinner{width:52px;height:52px;border:4px solid rgba(106,63,138,.15);border-top-color:#7C3AED;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;font-weight:600;color:#888;letter-spacing:.04em}

/* Error state */
#error-state{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:40px 24px;background:linear-gradient(135deg,#FDF6FF 0%,#F5F0FB 100%)}
#error-state.visible{display:flex}
.error-emoji{font-size:64px;line-height:1}
.error-title{font-size:24px;font-weight:800;color:#1A1625}
.error-sub{font-size:15px;color:#6C6473;max-width:320px}

/* Site root — filled by JS */
#site-root{display:none}
#site-root.visible{display:block}
</style>
</head>
<body>

</div>

<div id="site-root"></div>

    const brandDark = darkenHex(brand,40);

    const ldData={'@context':'https://schema.org','@type':'LocalBusiness','name':bizName,'description':metaDesc,'telephone':phone||undefined,'email':email||undefined,'image':heroPhoto||logo||undefined,'url':window.location.href,'address':cityLabel?{'@type':'PostalAddress','addressLocality':cityLabel,'addressCountry':'US'}:undefined,'areaServed':cityLabel?[{'@type':'City','name':cityLabel}]:undefined,'priceRange':pkgOffers.length?'$'+Math.min(...pkgOffers.map(o=>parseFloat(o.price)||999))+'–$'+Math.max(...pkgOffers.map(o=>parseFloat(o.price)||0)):'$$','hasOfferCatalog':pkgOffers.length?{'@type':'OfferCatalog','name':bizName+' Party Packages','itemListElement':pkgOffers}:undefined};

:root{--bg:#0D0820;--surface:#160D2B;--card:#1E1338;--brand:${g};--gold:#D4AE52;--gold-dk:#B8942E;--text:#F5F0FF;--muted:rgba(245,240,255,.55);--line:rgba(245,240,255,.1);--radius:14px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

a{text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}

.lx-nav{position:sticky;top:0;z-index:100;background:rgba(13,8,32,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}

.lx-initial{width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1a0e00;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lx-biz{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--text);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.lx-book-btn{background:var(--gold);color:#1a0e00;padding:10px 24px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;transition:background .18s,transform .18s}
.lx-book-btn:hover{background:var(--gold-dk);transform:translateY(-1px)}

/* HERO */
.lx-hero{min-height:90vh;display:flex;align-items:center;position:relative;overflow:hidden;padding:80px 28px}
.lx-hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(212,174,82,.08) 0%,transparent 70%)}
.lx-hero-lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(245,240,255,.025) 79px,rgba(245,240,255,.025) 80px)}

.lx-btn-ghost{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);color:var(--text);padding:16px 28px;border-radius:999px;font-size:14px;font-weight:600;transition:border-color .18s}
.lx-btn-ghost:hover{border-color:var(--gold)}

.lx-section{padding:88px 28px}
.lx-section-alt{background:var(--surface)}
.lx-max{max-width:1140px;margin:0 auto}

<style id="tpl-css">

    if(d.socialTiktok){const h=d.socialTiktok.replace(/^@/,'');items.push({href:'https://tiktok.com/@'+encodeURIComponent(h),icon:'🎵',label:'@'+h})}
    if(d.socialFacebook){const href=d.socialFacebook.startsWith('http')?d.socialFacebook:'https://facebook.com/'+encodeURIComponent(d.socialFacebook.replace(/^@/,''));items.push({href,icon:'👍',label:d.socialFacebook.replace(/^@/,'')})}
    if(d.socialYoutube){const href=d.socialYoutube.startsWith('http')?d.socialYoutube:'https://youtube.com/'+encodeURIComponent(d.socialYoutube.replace(/^@/,''));items.push({href,icon:'▶️',label:d.socialYoutube})}
    if(d.socialCustom)items.push({href:d.socialCustom.startsWith('http')?d.socialCustom:'https://'+d.socialCustom,icon:'🔗',label:d.socialCustom});
    return items;
  }

})();
</script>
</body>
</html>
