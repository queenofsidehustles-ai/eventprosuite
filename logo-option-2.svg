<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 96" width="500" height="96">
  <defs>
    <linearGradient id="ga" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- MONOGRAM: P · B · H  overlapping blocks, B is the hub (center, taller) -->

  <!-- P block (left, slightly smaller, offset down) -->
  <rect x="4" y="14" width="42" height="58" rx="11" fill="url(#gb)" opacity="0.82"/>

  <!-- B block (center, tallest — the hub) -->
  <rect x="28" y="4" width="50" height="78" rx="13" fill="url(#ga)"/>

  <!-- H block (right, mirrors P) -->
  <rect x="60" y="14" width="42" height="58" rx="11" fill="url(#gb)" opacity="0.82"/>

  <!-- Letters in white -->
  <text x="21" y="51" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="800" fill="rgba(255,255,255,0.92)">P</text>

  <text x="53" y="54" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="32" font-weight="800" fill="#ffffff">B</text>

  <text x="85" y="51" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="800" fill="rgba(255,255,255,0.92)">H</text>

  <!-- WORDMARK -->
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="44" y="62" letter-spacing="-1">
    <tspan x="122" fill="#1F1A24">Party </tspan><tspan fill="#6D28D9">Biz </tspan><tspan fill="#1F1A24">Hub</tspan>
  </text>

  <!-- TAGLINE -->
  <text x="123" y="82"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#6C6473" letter-spacing="0.08em">
    BUILD · BOOK · BE PAID
  </text>
</svg>
